name: Prototype participant SQLite test
on:
  push:
    branches:
      - test/participant-unique-index-sqlite-prototype
  pull_request:
    branches:
      - experiment/hypothetical-preferences-prototype
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
