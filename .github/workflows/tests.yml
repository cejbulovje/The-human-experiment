name: Automated tests

on:
  push:
    branches:
      - latest-local-work
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test
